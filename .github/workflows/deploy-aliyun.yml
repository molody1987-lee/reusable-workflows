name: Deploy to Aliyun (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      spring-profiles-active:
        required: false
        type: string
        default: ''
    secrets:
      ALIYUN_ROLE_ARN:
        required: true
      ACR_REGISTRY:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true
      ALIYUN_KUBECONFIG:
        required: true
      DB_URL:
        required: false
      DB_USERNAME:
        required: false
      DB_PASSWORD:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      # 用 OIDC 换取阿里云临时凭证
      - name: Configure Aliyun Credentials via OIDC
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ secrets.ALIYUN_ROLE_ARN }}
          oidc-provider-arn: acs:ram::1175150067325716:oidc-provider/github_molody_lee
          audience: sts.aliyuncs.com
      # 下载 命令行工具 yaml2env
      - name: Install yaml2env
        run: |
          go install github.com/huberp/yaml2env@latest

      - name: Load config into environment
        run: yaml2env ./src/main/resources/application.yml --set

      - name: Use application name
        run: |
          # yaml2env 通常会将嵌套键转换为类似 SPRING_APPLICATION_NAME 的格式
          echo "Spring App Name: $SPRING_APPLICATION_NAME"

      # 登录 ACR（个人版必须用固定密码）
      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            --username=${{ secrets.ACR_USERNAME }} \
            --password-stdin ${{ secrets.ACR_REGISTRY }}

      # 构建并推送镜像
      - name: Build and Push Docker Image
        run: |
          IMAGE=${{ secrets.ACR_REGISTRY }}/molody1987_lee/$SPRING_APPLICATION_NAME:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      # 配置 kubectl
      - name: Set up kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.ALIYUN_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # 部署
      - name: Deploy to ACK
        env:
          IMAGE: ${{ secrets.ACR_REGISTRY }}/molody1987_lee/$SPRING_APPLICATION_NAME:${{ github.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          PROFILE_OVERRIDE: ${{ inputs.spring-profiles-active }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # profile 优先级：显式 override > 按 environment 映射
          if [ -n "$PROFILE_OVERRIDE" ]; then
            SPRING_PROFILES_ACTIVE="$PROFILE_OVERRIDE"
          else
            case "$ENVIRONMENT" in
              production) SPRING_PROFILES_ACTIVE=prod ;;
              staging)    SPRING_PROFILES_ACTIVE=staging ;;
              *)          SPRING_PROFILES_ACTIVE="$ENVIRONMENT" ;;
            esac
          fi
          echo "resolved SPRING_PROFILES_ACTIVE=$SPRING_PROFILES_ACTIVE (environment=$ENVIRONMENT)"

          # 1) 设置镜像和环境变量
          kubectl set image deployment/$SPRING_APPLICATION_NAME $SPRING_APPLICATION_NAME="$IMAGE"
          kubectl set env deployment/$SPRING_APPLICATION_NAME \
            SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
            SPRING_DATASOURCE_URL="$DB_URL" \
            SPRING_DATASOURCE_USERNAME="$DB_USERNAME" \
            SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD"

          # 2) 等待滚动更新完成，显式检查退出码（避开 kubectl 超时返回 0 的 bug）
          echo "Waiting for rollout..."
          if ! kubectl rollout status deployment/$SPRING_APPLICATION_NAME --timeout=180s; then
            echo "ERROR: rollout failed or timed out"
            kubectl describe deployment $SPRING_APPLICATION_NAME
            kubectl get pods -o wide
            exit 1
          fi
          echo "Rollout completed."

      # 主动探活：绕过 kubectl 的判定，直接 HTTP 检查应用健康
      - name: Verify deployment health
        run: |
          echo "Probing application readiness..."
          for i in $(seq 1 18); do
            STATUS=$(kubectl exec deploy/$SPRING_APPLICATION_NAME -- \
              wget -qO- --timeout=3 http://localhost:8080/actuator/health/readiness 2>/dev/null || echo "")
            echo "  attempt $i: $STATUS"
            echo "$STATUS" | grep -q '"status":"UP"' && { echo "OK: application is READY"; exit 0; }
            sleep 5
          done
          echo "ERROR: health check did not return UP within 90s"
          kubectl logs deploy/$SPRING_APPLICATION_NAME --tail=100
          kubectl describe pod -l app=$SPRING_APPLICATION_NAME
          exit 1